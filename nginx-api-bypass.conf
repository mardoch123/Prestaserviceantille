# =============================================================================
# Configuration Nginx - Bypass Authentication Basique pour les APIs
# =============================================================================
# À ajouter dans votre configuration Nginx (généralement dans 
# /etc/nginx/sites-available/outremerfermetures ou similar)
# =============================================================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name outremerfermetures.com www.outremerfermetures.com;

    # ... vos certificats SSL habituels ...
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    root /var/www/outremerfermetures/dist;
    index index.html;

    # =============================================================================
    # IMPORTANT: Bypass l'authentification basique pour les endpoints API
    # + CORS headers pour Supabase Storage
    # ==============================================================================
    
    # Location pour les endpoints API - SANS auth basique
    location /api/ {
        # CORS headers pour Supabase Storage
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, x-upsert, x-requested-with, x-client-info, apikey' always;
        
        # Handle preflight OPTIONS requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, x-upsert, x-requested-with, x-client-info, apikey';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        # Pas de auth_basic ici - les API sont publiques
        # (ou protégées par leur propre mécanisme si nécessaire)
        
        # Si vos API sont des fichiers statiques JS:
        try_files $uri $uri/ =404;
        
        # Si vos API sont proxied vers un backend (Node/Express):
        # proxy_pass http://localhost:3000;
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection 'upgrade';
        # proxy_set_header Host $host;
        # proxy_cache_bypass $http_upgrade;
    }

    # =============================================================================
    # Authentification basique pour le reste du site (admin)
    # =============================================================================
    
    location /admin {
        auth_basic "Zone Admin - Authentification requise";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        try_files $uri $uri/ /index.html;
    }

    # Toutes les autres routes -> React Router
    location / {
        # Optionnel: Auth basique pour tout le site frontend
        # auth_basic "Accès protégé";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        
        try_files $uri $uri/ /index.html;
    }

    # Gestion des assets statiques (pas d'auth pour ces fichiers publics)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

